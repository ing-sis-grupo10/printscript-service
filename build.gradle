plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ar.edu.austral.grupo10'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	maven {
		url = uri('https://maven.pkg.github.com/ing-sis-grupo10/printscript')
		credentials {
			username = project.findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
			password = project.findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
		}
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'ar.edu.austral.ingsis.printscript:printscript-lexer:1.1.1'
	implementation 'ar.edu.austral.ingsis.printscript:printscript-parser:1.1.1'
	implementation 'ar.edu.austral.ingsis.printscript:printscript-ast:1.1.1'
	implementation 'ar.edu.austral.ingsis.printscript:printscript-common:1.1.1'
	implementation 'ar.edu.austral.ingsis.printscript:printscript-interpreter:1.1.1'
	implementation 'ar.edu.austral.ingsis.printscript:printscript-formatter:1.1.1'
	implementation 'ar.edu.austral.ingsis.printscript:printscript-analyzer:1.1.1'
}

tasks.named('test') {
	useJUnitPlatform()
}
